name: Qlty Code Quality

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qlty-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qlty-check:
    name: Run Qlty Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qlty CLI
        shell: bash
        run: |
          curl -fsSL https://qlty.sh | bash
          echo "$HOME/.qlty/bin" >> "$GITHUB_PATH"

      - name: Run Qlty checks
        shell: bash
        run: qlty check
